<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une journée ordinaire… qui dérape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Palette inspirée de la DA OnDijon
   bleu marine (le « n »), bleu ciel (trait / baseline), anthracite
   ========================================================= */
:root{
  --navy:#1B3A72;
  --navy-deep:#122852;
  --sky:#3D91CB;
  --sky-soft:#E6F1FA;
  --ink:#232D2E;
  --text:#2A3540;
  --muted:#5A6878;
  --line:#DCE5EF;
  --bg:#F2F6FA;
  --card:#FFFFFF;

  --brand:var(--navy);          /* titres, texte de marque */
  --brand-fill:var(--navy);     /* fonds de boutons */
  --brand-fill-hover:var(--navy-deep);
  --accent:var(--sky);

  --ok:#0F7A4A;   --ok-bg:#E7F6EE;   --ok-line:#A9DEC2;
  --warn:#9A5B06; --warn-bg:#FFF4E0; --warn-line:#F5D08F;
  --bad:#B42318;  --bad-bg:#FDECEA;  --bad-line:#F4B5AE;

  --radius:18px;
  --shadow:0 1px 2px rgba(18,40,82,.06), 0 8px 24px rgba(18,40,82,.07);
  --shadow-lift:0 2px 4px rgba(18,40,82,.08), 0 14px 32px rgba(18,40,82,.12);
  --font-size-base:16px;
  --font-title:"Montserrat", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.high-contrast{
  --bg:#0E1116; --card:#181D25; --text:#FFFFFF; --muted:#D7DDE5; --ink:#FFFFFF; --line:#5B6676;
  --brand:#9CCFFF; --brand-fill:#9CCFFF; --brand-fill-hover:#C4E3FF; --accent:#9CCFFF; --sky-soft:#1E2A3A;
  --ok:#6EE7A8; --ok-bg:transparent; --ok-line:#6EE7A8;
  --warn:#FFD166; --warn-bg:transparent; --warn-line:#FFD166;
  --bad:#FF8A80; --bad-bg:transparent; --bad-line:#FF8A80;
  --shadow:none; --shadow-lift:none;
}
.high-contrast .btn-primary{color:#0E1116}
.high-contrast .hero{background:#181D25;border:2px solid var(--line)}
.high-contrast .hero-deco{display:none}

*{box-sizing:border-box}
html{font-size:var(--font-size-base);scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  font-family:var(--font-body);color:var(--text);line-height:1.6;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(61,145,203,.14), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(27,58,114,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  transition:background-color .3s,color .3s;
}
.high-contrast body, body.high-contrast{background:var(--bg)}
/* trame de points discrète (réseau / ville connectée) */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(27,58,114,.10) 1px, transparent 1.4px);
  background-size:22px 22px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,.15));
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,.15));
}
body.high-contrast::before{display:none}
h1,h2,h3{font-family:var(--font-title);color:var(--ink);line-height:1.2;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
*:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
  background:linear-gradient(90deg,var(--sky),var(--navy) 70%);opacity:.9}
.topbar-inner{max-width:1040px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand-mark{width:38px;height:38px;flex:none;color:var(--accent)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text strong{font-family:var(--font-title);font-weight:700;color:var(--brand);font-size:1rem}
.brand-text span{font-family:var(--font-title);font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:600}
.a11y{display:flex;gap:.35rem;background:var(--sky-soft);padding:.25rem;border-radius:999px}
.a11y button{
  min-width:44px;min-height:40px;padding:0 .8rem;border:0;border-radius:999px;background:transparent;
  color:var(--brand);font-weight:600;font-size:.9rem;transition:background .2s,color .2s;
}
.a11y button:hover{background:var(--card)}
.a11y button[aria-pressed="true"]{background:var(--brand-fill);color:var(--card)}

/* ---------- Layout ---------- */
main{position:relative;z-index:1;flex:1;width:100%;max-width:1040px;margin:0 auto;padding:2rem 1.25rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-family:var(--font-title);font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.fade-in{animation:fadeIn .45s cubic-bezier(.2,.7,.3,1) both}
.stagger > *{animation:fadeIn .45s cubic-bezier(.2,.7,.3,1) both}
.stagger > *:nth-child(2){animation-delay:.07s}
.stagger > *:nth-child(3){animation-delay:.14s}
.stagger > *:nth-child(4){animation-delay:.21s}
.stagger > *:nth-child(5){animation-delay:.28s}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.75rem 1.4rem;
  border-radius:999px;border:2px solid transparent;font-family:var(--font-title);font-weight:700;font-size:1rem;
  transition:transform .15s, background .2s, box-shadow .2s, border-color .2s;text-decoration:none}
.btn svg{width:1.15em;height:1.15em}
.btn-primary{background:var(--brand-fill);color:#fff;box-shadow:0 6px 16px rgba(27,58,114,.25)}
.btn-primary:hover{background:var(--brand-fill-hover);transform:translateY(-1px)}
.btn-sky{background:var(--sky);color:#fff;box-shadow:0 6px 18px rgba(61,145,203,.35)}
.btn-sky:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--brand);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent);background:var(--sky-soft)}
.btn-lg{min-height:56px;padding:.9rem 1.8rem;font-size:1.08rem}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.88rem;padding:.4rem .6rem}
.link-btn:hover{color:var(--brand)}

/* ---------- Accueil ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:3.2rem 2.4rem 2.8rem;
  background:linear-gradient(135deg,#1F4384 0%,var(--navy) 45%,var(--navy-deep) 100%);
  box-shadow:0 20px 50px rgba(18,40,82,.28);
}
.hero-deco{position:absolute;right:-60px;top:-60px;width:440px;height:440px;opacity:.9;pointer-events:none}
.hero .eyebrow{color:#9CCFFF}
.hero h1{color:#fff;font-weight:800;font-size:clamp(2rem,5.2vw,3.4rem);letter-spacing:-.02em;margin:.8rem 0 1rem;max-width:14ch}
.skid{display:inline-block;color:#8EC9F5;transform:rotate(-3deg) skewX(-8deg);position:relative;transform-origin:left bottom;
  animation:skid 1s .4s cubic-bezier(.3,1.6,.5,1) both}
.skid::after{content:"";position:absolute;left:4%;right:-6%;bottom:-.08em;height:.12em;border-radius:4px;
  background:linear-gradient(90deg,transparent,#8EC9F5 30%,#8EC9F5 70%,transparent)}
@keyframes skid{from{transform:none;opacity:.3}to{transform:rotate(-3deg) skewX(-8deg);opacity:1}}
.hero-lead{max-width:56ch;font-size:1.08rem;color:#DCE8F7}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.6rem 0 2rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .85rem;border-radius:999px;font-size:.88rem;font-weight:600;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff}
.chip svg{width:1rem;height:1rem}
.day{margin-top:1.6rem;padding:1.6rem;border-radius:var(--radius)}
.day h2{font-size:1.05rem;margin-bottom:1.1rem}
.day-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;position:relative}
.day-list::before{content:"";position:absolute;left:10%;right:10%;top:26px;height:2px;
  background:repeating-linear-gradient(90deg,var(--sky) 0 8px,transparent 8px 14px);opacity:.6}
.day-list li{position:relative;text-align:center;font-size:.86rem;color:var(--muted)}
.day-ico{width:52px;height:52px;margin:0 auto .55rem;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:2px solid var(--sky);color:var(--brand);position:relative}
.day-ico svg{width:24px;height:24px}
.day-list strong{display:block;color:var(--ink);font-family:var(--font-title);font-size:.84rem}

/* ---------- Stepper de progression ---------- */
.stepper{display:flex;align-items:center;gap:.4rem;margin-bottom:1.6rem;list-style:none;padding:0}
.stepper li{flex:1;display:flex;align-items:center;gap:.4rem;min-width:0}
.stepper li:last-child{flex:none}
.step-dot{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-title);font-weight:700;font-size:.85rem;
  background:var(--card);border:2px solid var(--line);color:var(--muted);transition:all .3s}
.step-dot svg{width:18px;height:18px}
.step-bar{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.step-bar span{display:block;height:100%;width:0;background:var(--sky);transition:width .6s}
.stepper .done .step-dot{background:var(--sky);border-color:var(--sky);color:#fff}
.stepper .done .step-bar span{width:100%}
.stepper .current .step-dot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.step-meta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:-.8rem 0 1.3rem;font-size:.9rem;color:var(--muted)}
.step-meta b{color:var(--brand);font-family:var(--font-title)}

/* ---------- Situation ---------- */
.situation{padding:2.2rem 2.2rem 2rem;position:relative;overflow:hidden}
.situation::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--sky),var(--navy))}
.sit-head{display:flex;gap:1.1rem;align-items:flex-start;margin-bottom:1.4rem}
.sit-ico{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--sky-soft);color:var(--brand)}
.sit-ico svg{width:28px;height:28px}
.sit-head h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;margin:.3rem 0 .5rem}
.theme{display:inline-flex;flex-wrap:wrap;gap:.35rem}
.tag{font-size:.78rem;font-weight:600;padding:.22rem .65rem;border-radius:999px;background:var(--sky-soft);color:var(--brand)}
.story{font-size:1.08rem;display:flex;flex-direction:column;gap:1rem;max-width:68ch}
.story-text{color:var(--text)}

/* message vocal */
.voice{display:flex;gap:.8rem;align-items:flex-start;max-width:560px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-title);font-weight:700;color:#fff;background:linear-gradient(135deg,var(--sky),var(--navy))}
.bubble{background:var(--sky-soft);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:.85rem 1rem;flex:1}
.bubble-from{font-size:.8rem;font-weight:600;color:var(--brand);margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem}
.wave{display:flex;align-items:center;gap:3px;height:28px;margin:.2rem 0 .6rem}
.wave i{display:block;width:3px;border-radius:3px;background:var(--brand);opacity:.75;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{transform:scaleY(.45)}}
.bubble q{font-style:italic;quotes:"« " " »"}
.badge-mini{font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:6px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);letter-spacing:.02em}

/* document */
.doc{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);max-width:560px;overflow:hidden}
.doc-top{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:var(--sky-soft);font-size:.82rem;font-weight:600;color:var(--brand);border-bottom:1px solid var(--line)}
.doc-top svg{width:16px;height:16px}
.doc-body{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem;font-size:.98rem}
.doc-row{display:flex;align-items:center;gap:.6rem}
.doc-row .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.doc-row.flag{background:var(--warn-bg);border:1px dashed var(--warn-line);border-radius:8px;padding:.35rem .55rem}
.doc-row.flag em{margin-left:auto;font-style:normal;font-weight:700;color:var(--warn);font-size:.8rem}
.ghost-lines{display:flex;flex-direction:column;gap:6px;margin-bottom:.4rem}
.ghost-lines span{height:7px;border-radius:4px;background:var(--line)}
.hidden-instr{font-size:.92rem;font-style:italic;color:var(--bad);background:var(--bad-bg);border:1px dashed var(--bad-line);border-radius:8px;padding:.55rem .7rem;position:relative}
.hidden-instr::before{content:"Texte caché";display:block;font-style:normal;font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem}

/* chat IA */
.chat{display:flex;flex-direction:column;gap:.55rem;max-width:560px}
.msg{padding:.7rem .95rem;border-radius:16px;font-size:.98rem;max-width:88%}
.msg small{display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;margin-bottom:.15rem;opacity:.8}
.msg.me{align-self:flex-end;background:var(--brand-fill);color:#fff;border-bottom-right-radius:4px}
.high-contrast .msg.me{color:#0E1116}
.msg.ai{align-self:flex-start;background:var(--sky-soft);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--text)}
.mail{display:flex;align-items:center;gap:.8rem;max-width:560px;border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;background:var(--card);box-shadow:var(--shadow)}
.mail svg{width:26px;height:26px;color:var(--brand);flex:none}
.mail div{flex:1;font-size:.92rem;color:var(--muted)}
.mail b{color:var(--ink);display:block;font-size:.98rem}

/* révélation des décisions */
.reveal-zone{margin-top:2rem;padding-top:1.6rem;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.reveal-zone p{color:var(--muted);font-size:.95rem}

/* ---------- Choix ---------- */
.choices-wrap{margin-top:1.8rem}
.choices-wrap > h2{font-size:1.35rem;margin-bottom:.3rem}
.choices-wrap > p{color:var(--muted);margin-bottom:1.1rem}
.choices{display:grid;gap:1rem}
.choice{
  position:relative;display:flex;gap:1rem;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.3rem;
  box-shadow:var(--shadow);transition:transform .18s, box-shadow .2s, border-color .2s;color:var(--text)
}
.choice:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent)}
.choice-letter{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-title);font-weight:800;font-size:1.15rem;
  color:var(--brand);border:2.5px solid var(--brand);transition:all .2s;position:relative}
.choice:hover .choice-letter{background:var(--brand-fill);color:var(--card)}
.choice-body{flex:1;min-width:0}
.choice-title{display:block;font-family:var(--font-title);font-weight:700;font-size:1.1rem;color:var(--ink);margin-bottom:.2rem}
.choice-desc{display:block;color:var(--muted)}
.choice-arrow{flex:none;align-self:center;color:var(--accent);opacity:0;transform:translateX(-6px);transition:all .2s}
.choice:hover .choice-arrow{opacity:1;transform:none}
.choice.tried{opacity:.78}
.choice.tried .choice-letter{border-color:currentColor}
.choice.tried.t-danger .choice-letter{color:var(--bad);border-color:var(--bad)}
.choice.tried.t-warning .choice-letter{color:var(--warn);border-color:var(--warn)}
.tried-badge{display:inline-flex;align-items:center;gap:.3rem;margin-top:.55rem;font-size:.78rem;font-weight:700;padding:.18rem .6rem;border-radius:999px}

/* verdicts */
.v-danger{color:var(--bad);background:var(--bad-bg);border:1px solid var(--bad-line)}
.v-warning{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.v-success{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line)}

/* ---------- Analyse ---------- */
.verdict{border-radius:var(--radius);padding:1.6rem 1.8rem;display:flex;gap:1.2rem;align-items:center;margin-bottom:1.4rem;position:relative;overflow:hidden}
.verdict-ico{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid currentColor;position:relative}
.verdict-ico svg{width:32px;height:32px}
.verdict .label{font-family:var(--font-title);font-weight:800;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase}
.verdict h2{color:var(--ink);font-size:clamp(1.3rem,3vw,1.7rem);font-weight:800;margin-top:.2rem}
.verdict .sub{color:var(--muted);margin-top:.25rem;font-size:.95rem}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.burst{position:absolute;inset:-14px;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--ok);opacity:0;animation:burst .8s .2s ease-out both}
.burst i:nth-child(2n){background:var(--sky)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-46px)}}
.first-try{display:inline-flex;align-items:center;gap:.35rem;margin-left:.5rem;font-size:.75rem;font-weight:700;letter-spacing:.04em;padding:.2rem .6rem;border-radius:999px;background:var(--ok);color:#fff;vertical-align:middle}
.high-contrast .first-try{color:#0E1116}

.details{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.detail{padding:1.2rem 1.3rem}
.detail h3{display:flex;align-items:center;gap:.55rem;font-size:1rem;margin-bottom:.55rem}
.detail h3 .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.detail h3 .ic svg{width:18px;height:18px}
.detail p{color:var(--text);font-size:.98rem}
.ic-action{background:var(--sky-soft);color:var(--brand)}
.ic-csq{background:var(--bad-bg);color:var(--bad)}
.ic-why{background:var(--warn-bg);color:var(--warn)}
.ic-todo{background:var(--ok-bg);color:var(--ok)}
.ic-csq-ok{background:var(--ok-bg);color:var(--ok)}

.takeaway{margin-top:1.2rem;border-radius:var(--radius);padding:1.4rem 1.6rem;display:flex;gap:1rem;align-items:center;
  background:linear-gradient(120deg,var(--sky-soft),var(--card));border:1px solid var(--line);position:relative;overflow:hidden}
.takeaway::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.takeaway svg{width:34px;height:34px;color:var(--accent);flex:none}
.takeaway .eyebrow{display:block;margin-bottom:.15rem}
.takeaway p{font-family:var(--font-title);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.35}

.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:2rem}

/* autres options (accordéons) */
.section-title{display:flex;align-items:center;gap:.7rem;margin:2.4rem 0 1rem}
.section-title h2{font-size:1.3rem}
.section-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.alt{border-radius:var(--radius);margin-bottom:.8rem;overflow:hidden}
.alt summary{list-style:none;display:flex;gap:1rem;align-items:center;padding:1.1rem 1.3rem;cursor:pointer}
.alt summary::-webkit-details-marker{display:none}
.alt summary:hover{background:color-mix(in srgb,var(--sky-soft) 50%,transparent)}
.alt-letter{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-title);font-weight:800;border:2px solid currentColor;background:var(--card)}
.alt-main{flex:1;min-width:0}
.alt-main .t{font-family:var(--font-title);font-weight:700;color:var(--ink);display:block}
.alt-main .s{color:var(--muted);font-size:.93rem;display:block;margin-top:.1rem}
.alt-tag{font-size:.75rem;font-weight:700;padding:.18rem .6rem;border-radius:999px;white-space:nowrap}
.chev{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .25s}
.alt[open] .chev{transform:rotate(180deg)}
.alt-body{padding:0 1.3rem 1.3rem 4.6rem;display:grid;gap:.9rem}
.alt-body h4{margin:0 0 .2rem;font-family:var(--font-title);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.alt-body p{font-size:.97rem}
.alt-body .quote{font-family:var(--font-title);font-weight:700;color:var(--ink);border-left:3px solid currentColor;padding-left:.8rem}
.you-tried{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:.12rem .5rem;border-radius:999px;margin-left:.4rem;white-space:nowrap}

.practice{border-radius:var(--radius);padding:1.6rem 1.8rem;color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);box-shadow:0 14px 34px rgba(18,40,82,.22);position:relative;overflow:hidden}
.practice .eyebrow{color:#9CCFFF}
.practice p{font-size:1.1rem;margin-top:.5rem;color:#fff;font-weight:500;max-width:70ch}
.practice svg.bg{position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;opacity:.12;color:#fff}
.high-contrast .practice{background:var(--card);border:2px solid var(--brand)}

.next-story{margin-top:1.4rem;padding:1.4rem 1.6rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.next-story .txt{flex:1;min-width:240px}
.next-story .txt p{font-style:italic;color:var(--text);margin-top:.3rem}

/* ---------- Fin ---------- */
.end-hero{text-align:center;padding:3rem 2rem}
.score-ring{width:170px;height:170px;margin:0 auto 1.4rem;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-title);font-weight:800;font-size:2.4rem;color:var(--brand)}
.score-ring .num > span{text-align:center;line-height:1.1}
.score-ring .num small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:.25rem;max-width:9ch;margin-inline:auto;line-height:1.2}
.end-hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-bottom:.6rem}
.end-hero > p{max-width:58ch;margin:0 auto;color:var(--muted);font-size:1.05rem}
.recap{list-style:none;margin:1.4rem 0 0;padding:0;display:grid;gap:.8rem}
.recap li{display:flex;gap:1rem;align-items:flex-start;padding:1.1rem 1.2rem}
.recap .n{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);color:var(--brand)}
.recap .n svg{width:20px;height:20px}
.recap .t{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.recap p{font-family:var(--font-title);font-weight:700;color:var(--ink)}
.recap .res{margin-left:auto;flex:none;font-size:.75rem;font-weight:700;padding:.18rem .6rem;border-radius:999px;align-self:center}

footer{position:relative;z-index:1;text-align:center;font-size:.8rem;color:var(--muted);padding:1rem}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  main{padding:1.2rem .9rem 3rem}
  .hero{padding:2.2rem 1.4rem}
  .hero-deco{width:300px;height:300px;right:-110px;top:-80px;opacity:.5}
  .day-list{grid-template-columns:1fr;gap:.6rem}
  .day-list::before{left:25px;right:auto;top:10px;bottom:10px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--sky) 0 8px,transparent 8px 14px)}
  .day-list li{display:flex;align-items:center;gap:.8rem;text-align:left}
  .day-ico{margin:0}
  .situation{padding:1.5rem 1.2rem}

  .verdict{padding:1.2rem;flex-direction:column;align-items:flex-start}

@media (prefers-reduced-motion:reduce){

const state = {
  index: 0,
  phase: "start",          // start | situation | feedback | result | end
  choicesShown: false,
  tried: [],               // ids essayés dans la situation courante
  current: null,           // id de la décision affichée
  revealed: false,         // réponse révélée sans l'avoir trouvée
  results: [],             // par situation : "first" | "found" | "revealed"
  fontSize: 16,
  hc: false
};
const app = document.getElementById("app");

/* ---------- Accessibilité ---------- */
document.getElementById("btn-text-increase").addEventListener("click", () => {
  if (state.fontSize < 24) { state.fontSize += 2; document.documentElement.style.setProperty("--font-size-base", state.fontSize + "px"); }
});
document.getElementById("btn-text-decrease").addEventListener("click", () => {
  if (state.fontSize > 12) { state.fontSize -= 2; document.documentElement.style.setProperty("--font-size-base", state.fontSize + "px"); }
});
document.getElementById("btn-contrast").addEventListener("click", (e) => {
  state.hc = !state.hc;
  document.body.classList.toggle("high-contrast", state.hc);
  e.currentTarget.setAttribute("aria-pressed", state.hc);
});

/* ---------- Helpers ---------- */
const sc = () => scenarios[state.index];
const byId = (s, id) => s.choices.find(c => c.id === id);
const letterOf = (s, id) => "ABC"[s.order.indexOf(id)];
const correctOf = s => s.choices.find(c => c.type === "success");
const stripLetters = t => t.replace(/\s*\([ABC]\)/g, "");

function focusHeading(scroll = true) {
  if (scroll) window.scrollTo({ top: 0, behavior: "auto" });
  setTimeout(() => { const h = document.getElementById("step-heading"); if (h) h.focus({ preventScroll: true }); }, 60);
}

/* ---------- Navigation ---------- */
function startWorkshop() { state.index = 0; state.results = []; enterSituation(); }
function enterSituation() {
  state.phase = "situation"; state.choicesShown = false; state.tried = []; state.current = null; state.revealed = false;
  render();
}
function showChoices() {
  state.choicesShown = true;
  render(false);
  setTimeout(() => {
    const el = document.getElementById("choices");
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); document.getElementById("choices-heading").focus({ preventScroll: true }); }
  }, 80);
}
function pick(id) {
  const s = sc(), c = byId(s, id);
  if (!state.tried.includes(id)) state.tried.push(id);
  state.current = id;
  if (c.type === "success") {
    if (!state.results[state.index]) state.results[state.index] = state.tried.length === 1 ? "first" : "found";
    state.phase = "result";
  } else {
    state.phase = "feedback";
  }
  render();
}
function retry() {
  state.phase = "situation"; state.choicesShown = true; render(false);
  setTimeout(() => {
    const el = document.getElementById("choices");
    if (el) { el.scrollIntoView({ behavior: "auto", block: "start" }); document.getElementById("choices-heading").focus({ preventScroll: true }); }
  }, 40);
}
function revealAnswer() {
  state.revealed = true;
  if (!state.results[state.index]) state.results[state.index] = "revealed";
  state.current = correctOf(sc()).id;
  state.phase = "result"; render();
}
function next() {
  if (state.index < scenarios.length - 1) { state.index++; enterSituation(); }
  else { state.phase = "end"; render(); }
}
function restart() { state.index = 0; state.phase = "start"; state.results = []; render(); }

/* =========================================================
   VUES
   ========================================================= */
function stepper() {
  const items = scenarios.map((s, i) => {
    const cls = i < state.index ? "done" : i === state.index ? "current" : "";
    const inner = i < state.index ? I.check : (i + 1);
    const bar = i < scenarios.length - 1 ? `<span class="step-bar"><span></span></span>` : "";
    return `<li class="${cls}"><span class="step-dot" title="${s.short}">${inner}</span>${bar}</li>`;
  }).join("");
  return `
    <ol class="stepper fade-in" aria-label="Progression">${items}</ol>
    <div class="step-meta fade-in"><span>Situation <b>${state.index + 1}</b> sur ${scenarios.length}</span><span>${sc().short}</span></div>`;
}

function storyBlock(b) {
  switch (b.type) {
    case "text":
      return `<p class="story-text">${b.html}</p>`;
    case "voice": {
      const bars = Array.from({ length: 34 }, (_, i) => {
        const h = 6 + Math.round(Math.abs(Math.sin(i * 1.7) * 18 + Math.sin(i * .6) * 6));
        return `<i style="height:${h}px;animation-delay:${(i % 7) * .12}s"></i>`;
      }).join("");
      return `
        <div class="voice">
          <span class="avatar" aria-hidden="true">${b.initials}</span>
          <div class="bubble">
            <div class="bubble-from">${b.from} <span class="badge-mini">URGENT</span></div>
            <div class="wave" aria-hidden="true">${bars}</div>
            <q>${b.html}</q>
          </div>
        </div>`;
    }
    case "doc": {
      const rows = b.rows.map(r => {
        const o = typeof r === "string" ? { text: r } : r;
        return o.flag
          ? `<div class="doc-row flag">${o.text}<em>Vraiment ?</em></div>`
          : `<div class="doc-row"><span class="dot" aria-hidden="true"></span>${o.text}</div>`;
      }).join("");
      const ghost = b.ghost ? `<div class="ghost-lines" aria-hidden="true"><span style="width:92%"></span><span style="width:78%"></span><span style="width:85%"></span></div>` : "";
      return `<div class="doc"><div class="doc-top">${I.doc}${b.name}</div><div class="doc-body">${ghost}${rows}</div></div>`;
    }
    case "hidden":
      return `
        <div class="doc"><div class="doc-top">${I.doc}${b.name}</div>
          <div class="doc-body">
            <div class="ghost-lines" aria-hidden="true"><span style="width:95%"></span><span style="width:82%"></span><span style="width:88%"></span><span style="width:60%"></span></div>
            <div class="hidden-instr">${b.html}</div>
          </div>
        </div>`;
    case "chat":
      return `<div class="chat">${b.messages.map(m => `<div class="msg ${m.who}"><small>${m.label}</small>${m.html}</div>`).join("")}</div>`;
    case "mail":
      return `<div class="mail">${I.mail}<div><b>${b.title}</b>${b.meta}</div><span class="badge-mini">ERREUR</span></div>`;
  }
  return "";
}

    bottom = `

        <button class="btn btn-primary btn-lg" onclick="showChoices()">Que faites-vous ? ${I.arrow}</button>
      </div>`;
  } else {
    bottom = "";
  }
  let choices = "";
  if (state.choicesShown) {
    const cards = s.order.map((id, pos) => {
      const c = byId(s, id), tried = state.tried.includes(id), v = VERDICT[c.type];
      return `
        <button class="choice ${tried ? "tried t-" + c.type : ""}" onclick="pick('${id}')" aria-label="Décision ${"ABC"[pos]} : ${c.title}${tried ? " (déjà essayée : " + v.label + ")" : ""}">
          <span class="choice-letter" aria-hidden="true">${"ABC"[pos]}</span>
          <span class="choice-body">
            <span class="choice-title">${c.title}</span>
            <span class="choice-desc">${c.desc}</span>
            ${tried ? `<span class="tried-badge ${v.cls}">${v.label} — revoir l'analyse</span>` : ""}
          </span>
          <span class="choice-arrow" aria-hidden="true">${I.arrow}</span>
        </button>`;
    }).join("");
    const hint = state.tried.length ? "Ce n'était pas le meilleur réflexe. Essayez une autre décision." : "Une seule de ces décisions est le bon réflexe.";
    choices = `
      <section id="choices" class="choices-wrap">
        <h2 id="choices-heading" tabindex="-1">Que faites-vous ?</h2>
        <p>${hint}</p>
        <div class="choices stagger">${cards}</div>
        <div style="text-align:center;margin-top:1.4rem">
          <button class="link-btn" onclick="revealAnswer()">Animateur : révéler la bonne réponse</button>
        </div>
      </section>`;
  }
  return `
    ${stepper()}
    <article class="card situation fade-in">
      <div class="sit-head">
        <span class="sit-ico" aria-hidden="true">${s.icon}</span>
        <div>
          <span class="eyebrow">Situation ${state.index + 1}</span>
          <h2 id="step-heading" tabindex="-1">${s.title}</h2>
          <div class="theme" aria-label="Thèmes">${s.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        </div>
      </div>
      <div class="story">${story}</div>
      ${bottom}
    </article>
    ${choices}`;
}

function detailCards(c, success) {
  const d = c.details;
  return `
    <div class="details stagger">
      <div class="card detail"><h3><span class="ic ic-action">${I.bolt}</span>Ce qui se passe</h3><p>${d.action}</p></div>
      <div class="card detail"><h3><span class="ic ${success ? "ic-csq-ok" : "ic-csq"}">${success ? I.shield : I.alert}</span>${success ? "Le résultat" : "Les conséquences"}</h3><p>${d.consequences}</p></div>
      <div class="card detail"><h3><span class="ic ic-why">${I.search}</span>${success ? "Pourquoi ça marche" : "Pourquoi c'est un piège"}</h3><p>${d.why}</p></div>
      <div class="card detail"><h3><span class="ic ic-todo">${I.check}</span>${success ? "Pour aller plus loin" : "Ce qu'il fallait faire"}</h3><p>${d.todo}</p></div>
    </div>
    <div class="takeaway fade-in">${I.bulb}<div><span class="eyebrow">Message essentiel</span><p>${d.takeaway}</p></div></div>`;
}

function viewFeedback() {
  const s = sc(), c = byId(s, state.current), v = VERDICT[c.type];
  const sub = c.type === "warning"
    ? "L'intention était bonne… mais la vérification n'en était pas une."
    : "Cette décision fait le jeu de l'attaquant.";
  return `
    ${stepper()}
    <section class="verdict ${v.cls} fade-in">
      <span class="verdict-ico pop" aria-hidden="true">${v.icon}</span>
      <div>
        <span class="label">Décision ${letterOf(s, c.id)} · ${v.label}</span>
        <h2 id="step-heading" tabindex="-1">${c.title}</h2>
        <p class="sub">${sub}</p>
      </div>
    </section>
    ${detailCards(c, false)}
    <div class="actions">
      <button class="btn btn-primary btn-lg" onclick="retry()">${I.back} Essayer une autre décision</button>
      <button class="btn btn-ghost btn-lg" onclick="revealAnswer()">${I.eye} Voir la bonne réponse</button>
    </div>`;
}

function viewResult() {
  const s = sc(), c = correctOf(s), v = VERDICT.success;
  const res = state.results[state.index];
  const title = res === "revealed" ? "La bonne réponse" : "Bon réflexe !";
  const badge = res === "first" ? `<span class="first-try">${I.check.replace('<svg','<svg width="12" height="12"')} Du premier coup</span>` : "";
  const sub = res === "revealed" ? "Voici la décision à retenir pour cette situation." : (res === "first" ? "Vous avez évité le piège dès le départ." : "Vous avez fini par trouver la bonne décision.");
  const burst = res !== "revealed" ? `<span class="burst">${Array.from({length:10},(_,i)=>`<i style="--a:${i*36}deg"></i>`).join("")}</span>` : "";

  const others = s.order.filter(id => id !== c.id).map(id => {
    const o = byId(s, id), ov = VERDICT[o.type], tried = state.tried.includes(id);
    return `
      <details class="card alt">
        <summary>
          <span class="alt-letter ${ov.cls}" style="background:var(--card)">${letterOf(s, id)}</span>
          <span class="alt-main">
            <span class="t">${o.title}${tried ? `<span class="you-tried">Votre essai</span>` : ""}</span>
            <span class="s">${stripLetters(s.synthesis.comparison[id])}</span>
          </span>
          <span class="alt-tag ${ov.cls}">${ov.label}</span>
          ${I.chev}
        </summary>
        <div class="alt-body">
          <div><h4>Ce qui se serait passé</h4><p>${o.details.action}</p></div>
          <div><h4>Les conséquences</h4><p>${o.details.consequences}</p></div>
          <div><h4>Pourquoi c'est un piège</h4><p>${o.details.why}</p></div>
          <p class="quote" style="border-left-color:${o.type === "danger" ? "var(--bad)" : "var(--warn)"}">« ${o.details.takeaway} »</p>
        </div>
      </details>`;
  }).join("");

  const isLast = state.index === scenarios.length - 1;
  const nextBlock = isLast
    ? `<div class="actions"><button class="btn btn-sky btn-lg" onclick="next()">Voir le bilan de l'atelier ${I.arrow}</button></div>`
    : `<section class="card next-story fade-in">
         <div class="txt"><span class="eyebrow">La suite de l'histoire…</span><p>${s.transition}</p></div>
         <button class="btn btn-sky btn-lg" onclick="next()">Situation suivante ${I.arrow}</button>
       </section>`;

  return `
    ${stepper()}
    <section class="verdict ${v.cls} fade-in">
      <span class="verdict-ico pop" aria-hidden="true">${v.icon}${burst}</span>
      <div>
        <span class="label">Décision ${letterOf(s, c.id)} · ${v.label}</span>
        <h2 id="step-heading" tabindex="-1">${title} ${badge}</h2>
        <p class="sub"><b>${c.title}.</b> ${sub}</p>
      </div>
    </section>
    ${detailCards(c, true)}

    <div class="section-title"><h2>Et si vous aviez choisi autrement ?</h2></div>
    ${others}

    <section class="practice fade-in" style="margin-top:1.6rem">
      <svg class="bg" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M13 9.5a14 14 0 1 0 14 0"/><path d="M20 4v13"/></svg>
      <span class="eyebrow">Le réflexe professionnel à adopter</span>
      <p>${s.synthesis.practice}</p>
    </section>
    ${nextBlock}`;
}

function viewEnd() {
  const first = state.results.filter(r => r === "first").length, total = scenarios.length;
  const pct = first / total, C = 2 * Math.PI * 64;
  const msg = first === total ? "Sans faute ! Vous avez déjoué tous les pièges du premier coup."
    : first >= 3 ? "Très bien joué ! Les bons réflexes sont là, gardez-les au quotidien."
    : "Ces pièges sont conçus pour tromper : c'est justement pour ça qu'on s'entraîne.";
  const RES = { first:["Du premier coup","v-success"], found:["Trouvée","v-warning"], revealed:["Révélée","v-danger"] };
  const recap = scenarios.map((s, i) => {
    const r = RES[state.results[i]] || ["—", ""];
    return `<li class="card"><span class="n" aria-hidden="true">${s.icon}</span>
      <div><span class="t">${i + 1}. ${s.short}</span><p>${correctOf(s).details.takeaway}</p></div>
      <span class="res ${r[1]}">${r[0]}</span></li>`;
  }).join("");
  return `
    <section class="card end-hero fade-in">
      <div class="score-ring" role="img" aria-label="${first} situations sur ${total} réussies du premier coup">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="75" cy="75" r="64" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset 1s"/></svg>
        <span class="num"><span>${first}/${total}<small>du premier coup</small></span></span>
      </div>
      <h1 id="step-heading" tabindex="-1">Journée terminée, attaques déjouées</h1>
      <p>${msg} La cybersécurité et l'usage responsable de l'IA sont l'affaire de tous, au quotidien.</p>
    </section>
    <div class="section-title"><h2>Les 5 réflexes à retenir</h2></div>
    <ol class="recap stagger">${recap}</ol>
    <div class="actions">
      <button class="btn btn-ghost btn-lg" onclick="restart()">${I.refresh} Recommencer l'atelier</button>
    </div>`;
}

function render(scroll = true) {
  const views = { start:viewStart, situation:viewSituation, feedback:viewFeedback, result:viewResult, end:viewEnd };
  app.innerHTML = views[state.phase]();
  if (scroll) focusHeading(true);
}

render();
</script>
</body>
</html>
